# This workflow intentionally does not download or execute user-provided archives.
# Copy this controlled build workflow to each approved Android repository as android-build.yml.
name: Controlled Android Build

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: Discord user ID used only to release the Worker build lock
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out approved source
        uses: actions/checkout@v4

      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

# Configure an authenticated callback only after deploying the Worker to a fixed HTTPS URL.
# Until then, builds are tracked through GitHub Actions and Worker locks expire automatically.
